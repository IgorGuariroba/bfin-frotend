name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela workflows anteriores da mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Verificação de Código
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript Check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🎨 Design Tokens Check
        run: npm run check:tokens

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Job 2: Testes
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Vitest
        run: npm test -- --run --reporter=verbose
        env:
          VITE_API_BASE_URL: http://localhost:3000
        continue-on-error: true

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Job 3: Testes E2E com Backend
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎯 Clone Backend Repository
        run: git clone https://github.com/IgorGuariroba/bfin-backend.git backend

      - name: 🐳 Start Backend with Docker
        run: |
          cd backend
          docker compose up -d
        env:
          DOCKER_BUILDKIT: 1

      - name: ⏳ Wait for Backend to be Ready
        run: |
          echo "Aguardando backend ficar disponível..."
          timeout 60 bash -c 'until curl -f http://localhost:3000/health 2>/dev/null || curl -f http://localhost:3000/api/health 2>/dev/null || curl -f http://localhost:3000/ 2>/dev/null; do sleep 2; done' || echo "Backend pode não ter endpoint de health, continuando..."
          sleep 5

      - name: 🐛 Debug E2E Environment
        if: failure()
        run: bash scripts/debug-e2e-ci.sh

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run E2E Tests (Smoke Only)
        run: |
          echo "🔍 Verificando se backend está respondendo..."
          curl -f http://localhost:3000/health || curl -f http://localhost:3000/api/health || curl -f http://localhost:3000/ || echo "⚠️ Backend não respondeu, mas continuando com testes..."

          echo "🎭 Executando Smoke Tests..."
          npx playwright test --project=chromium-auth --grep="login|Login|deve fazer login|formulário de login"
        env:
          CI: false
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:3000

      - name: 📊 Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: 🐳 Cleanup Backend
        if: always()
        run: |
          cd backend && docker compose down || true

  # Job 4: Build Validation
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000' }}

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: 📊 Build Stats
        run: |
          echo "### 📦 Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | awk '{printf "| %s | %s |\n", $2, $1}' >> $GITHUB_STEP_SUMMARY

  # Job 5: Summary Final
  summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, tests, e2e-tests, build]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🎉 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any critical job failed
        if: needs.code-quality.result == 'failure' || needs.build.result == 'failure'
        run: exit 1

      - name: ⚠️ Warn if optional jobs failed
        if: needs.tests.result == 'failure' || needs.e2e-tests.result == 'failure'
        run: |
          echo "⚠️ Alguns testes falharam mas o build pode prosseguir"
          echo "📋 Revise os resultados dos testes antes de fazer merge"
