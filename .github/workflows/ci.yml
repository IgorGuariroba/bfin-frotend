name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela workflows anteriores da mesma branch (mas não cancela E2E em PRs)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Job 1: Verificação de Código
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript Check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🎨 Design Tokens Check
        run: npm run check:tokens

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

  # Job 2: Testes E2E (Frontend + Backend)
  tests:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest
    needs: [code-quality, build]
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎯 Clone Backend Repository
        run: git clone https://github.com/IgorGuariroba/bfin-backend.git backend

      - name: 🐳 Start Backend with Docker
        run: |
          cd backend
          docker compose up -d
        env:
          DOCKER_BUILDKIT: 1

      - name: ⏳ Wait for Backend to be Ready
        run: |
          echo "Aguardando backend ficar disponível..."

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            if curl -f -s http://localhost:3000/health >/dev/null 2>&1 || \
               curl -f -s http://localhost:3000/api/health >/dev/null 2>&1 || \
               curl -f -s http://localhost:3000/ >/dev/null 2>&1; then
              echo "✅ Backend está respondendo!"
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "⚠️ Backend pode não ter endpoint de health, mas continuando..."
              echo "📋 Status dos containers:"
              cd backend && docker compose ps || true
              echo "📋 Logs do backend:"
              cd backend && docker compose logs --tail=30 app || echo "Sem logs disponíveis"
              cd ..
              break
            fi

            echo -n "."
            sleep 2
          done

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🚀 Start Frontend Dev Server
        run: npm run dev &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: ⏳ Wait for Frontend to be Ready
        run: |
          echo "Aguardando frontend ficar disponível..."

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            if curl -f -s http://localhost:5173 >/dev/null 2>&1; then
              echo "✅ Frontend está respondendo!"
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Frontend não respondeu após ${MAX_ATTEMPTS} tentativas"
              exit 1
            fi

            echo -n "."
            sleep 2
          done

      - name: 🧪 Run Playwright Tests
        run: npm run test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: 🐳 Cleanup Backend
        if: always()
        run: |
          cd backend && docker compose down || true

  # Job 3: Build Validation
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000' }}

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: 📊 Build Stats
        run: |
          echo "### 📦 Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | awk '{printf "| %s | %s |\n", $2, $1}' >> $GITHUB_STEP_SUMMARY
