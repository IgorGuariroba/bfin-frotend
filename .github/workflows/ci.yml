name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela workflows anteriores da mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Verificação de Código (roda em paralelo com build)
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript Check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🎨 Design Tokens Check
        run: npm run check:tokens

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

  # Job 2: Build Validation (roda em paralelo com code-quality)
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000' }}

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: 📊 Build Stats
        run: |
          echo "### 📦 Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | awk '{printf "| %s | %s |\n", $2, $1}' >> $GITHUB_STEP_SUMMARY

  # Job 3: Testes E2E (depende de code-quality e build)
  tests:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest
    needs: [code-quality, build]
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for E2E (with localhost API)
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: 🎯 Clone Backend Repository
        run: git clone --depth 1 https://github.com/IgorGuariroba/bfin-backend.git backend

      - name: 🐳 Start Backend with Docker
        run: |
          cd backend
          cp $GITHUB_WORKSPACE/.github/docker-compose.ci.yml .
          docker compose -f docker-compose.ci.yml up -d --build
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: 🎭 Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 🎭 Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🎭 Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: ⏳ Wait for Backend to be Ready
        run: |
          echo "Aguardando backend ficar disponível..."
          for i in $(seq 1 90); do
            if curl -f -s http://localhost:3000/health >/dev/null 2>&1 || \
               curl -f -s http://localhost:3000/api/health >/dev/null 2>&1 || \
               curl -f -s http://localhost:3000/api/v1/health >/dev/null 2>&1 || \
               curl -f -s http://localhost:3000/ >/dev/null 2>&1; then
              echo "✅ Backend disponível após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Backend não respondeu após 90s"
          docker compose -f backend/docker-compose.ci.yml ps || true
          docker compose -f backend/docker-compose.ci.yml logs --tail=50 app 2>&1 || true
          exit 1

      - name: 🧪 Run Playwright Tests
        run: npm run test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          CI: true

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: 🐳 Cleanup Backend
        if: always()
        run: |
          cd backend && docker compose -f docker-compose.ci.yml down || true
