name: E2E Tests

# Executa testes E2E manualmente ou em casos específicos
on:
  # Execução manual
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser para executar os testes'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

      test_pattern:
        description: 'Padrão de testes para executar (opcional)'
        required: false
        default: ''
        type: string

      headed:
        description: 'Executar com browser visível'
        required: false
        default: false
        type: boolean

  # Executa em schedule (todas as noites)
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC todos os dias

  # Executa em releases
  release:
    types: [published]

# Cancela workflows anteriores
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Configurações padrão para E2E
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  FORCE_COLOR: 1

jobs:
  e2e-comprehensive:
    name: 🎭 Comprehensive E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: 🔍 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.project }}-

      - name: 🏗️ Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3001

      - name: 🎭 Run E2E Tests
        run: |
          # Determina qual projeto executar baseado no input ou matrix
          if [ "${{ github.event.inputs.browser }}" = "all" ] || [ "${{ github.event.inputs.browser }}" = "" ]; then
            PROJECT="${{ matrix.project }}"
          else
            PROJECT="${{ github.event.inputs.browser }}"
          fi

          # Determina padrão de testes
          TEST_PATTERN="${{ github.event.inputs.test_pattern }}"

          # Configura comando base
          CMD="npx playwright test --project=$PROJECT"

          # Adiciona padrão se especificado
          if [ ! -z "$TEST_PATTERN" ]; then
            CMD="$CMD $TEST_PATTERN"
          fi

          # Adiciona modo headed se solicitado
          if [ "${{ github.event.inputs.headed }}" = "true" ]; then
            CMD="$CMD --headed"
          fi

          echo "Executando: $CMD"
          eval $CMD
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: 📊 Upload Test Results (Success)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: e2e-report-${{ matrix.project }}-success
          path: |
            playwright-report/
          retention-days: 14

      - name: 📊 Upload Test Results (Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: 📷 Upload Screenshots & Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-media-${{ matrix.project }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 7

  # Job para executar testes mobile
  e2e-mobile:
    name: 📱 Mobile E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        device: ['Mobile Chrome', 'Mobile Safari']

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Setup NPM Authentication
        run: |
          echo "@igorguariroba:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🏗️ Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3001

      - name: 📱 Run Mobile E2E Tests
        run: npx playwright test --project="${{ matrix.device }}"
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: 📊 Upload Mobile Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-mobile-${{ matrix.device }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Job de summary
  summary:
    name: 📋 E2E Summary
    runs-on: ubuntu-latest
    needs: [e2e-comprehensive, e2e-mobile]
    if: always()

    steps:
      - name: 📊 Generate E2E Summary
        run: |
          echo "# 🎭 E2E Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Desktop Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium | ${{ needs.e2e-comprehensive.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firefox | ${{ needs.e2e-comprehensive.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WebKit | ${{ needs.e2e-comprehensive.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Mobile Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Chrome | ${{ needs.e2e-mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Safari | ${{ needs.e2e-mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** ${{ github.event.head_commit.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

          # Inputs do workflow manual
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Manual Execution Inputs" >> $GITHUB_STEP_SUMMARY
            echo "- **Browser:** ${{ github.event.inputs.browser }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Pattern:** ${{ github.event.inputs.test_pattern || 'All tests' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Headed Mode:** ${{ github.event.inputs.headed }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ❌ Fail if any E2E job failed
        if: needs.e2e-comprehensive.result == 'failure' || needs.e2e-mobile.result == 'failure'
        run: |
          echo "::error::One or more E2E test jobs failed"
          exit 1